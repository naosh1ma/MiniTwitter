<header class="sticky top-0 z-10 flex h-14 items-center justify-between border-b border-slate-200 bg-white/90 px-4 backdrop-blur sm:px-6">
  <div class="nav-brand">
    <a routerLink="/feed" class="text-lg font-bold text-brand-600">MiniTwitter</a>
  </div>

  <div class="flex items-center gap-4 text-sm" *ngIf="isAuthenticated">
    <span class="hidden text-slate-500 sm:inline">Welcome, {{ user?.username }}</span>
    <a routerLink="/feed" routerLinkActive="text-brand-600" class="font-medium text-slate-700 hover:text-brand-600">Feed</a>
    <a routerLink="/profile" routerLinkActive="text-brand-600" class="font-medium text-slate-700 hover:text-brand-600">Profile</a>
    <button
      (click)="logout()"
      class="rounded-full bg-slate-100 px-3 py-1.5 font-medium text-slate-700 transition hover:bg-red-50 hover:text-red-600"
    >
      Logout
    </button>
  </div>

  <div class="flex items-center gap-4 text-sm" *ngIf="!isAuthenticated">
    <a
      routerLink="/auth"
      class="rounded-full bg-brand-600 px-4 py-1.5 font-medium text-white transition hover:bg-brand-700"
    >
      Login
    </a>
  </div>
</header>
