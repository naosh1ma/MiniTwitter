<div class="mx-auto max-w-xl px-4 py-6 sm:px-0">
  <h2 class="mb-4 text-xl font-bold text-slate-900">Feed</h2>

  <app-create-post (postCreated)="onPostCreated()"></app-create-post>

  <div class="mt-4 flex gap-1 border-b border-slate-200" *ngIf="currentUsername">
    <button
      (click)="switchTab('forYou')"
      class="px-3 py-2 text-sm font-semibold"
      [class.text-brand-600]="tab === 'forYou'"
      [class.border-brand-600]="tab === 'forYou'"
      [class.border-b-2]="tab === 'forYou'"
      [class.text-slate-500]="tab !== 'forYou'"
    >
      For You
    </button>
    <button
      (click)="switchTab('following')"
      class="px-3 py-2 text-sm font-semibold"
      [class.text-brand-600]="tab === 'following'"
      [class.border-brand-600]="tab === 'following'"
      [class.border-b-2]="tab === 'following'"
      [class.text-slate-500]="tab !== 'following'"
    >
      Following
    </button>
  </div>

  <div *ngIf="error" class="mt-6 rounded-lg bg-red-50 px-4 py-3 text-sm text-red-600">
    Couldn't load the feed. Please try again later.
  </div>

  <div *ngIf="!error && posts.length === 0" class="mt-6 text-center text-sm text-slate-500">
    No posts yet{{ tab === 'following' ? ' from people you follow' : '' }}.
  </div>

  <div class="mt-4 flex flex-col gap-3">
    <div *ngFor="let post of posts" class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
      <div class="flex items-baseline justify-between">
        <a
          [routerLink]="['/users', post.author.username]"
          class="text-sm font-semibold text-slate-900 hover:text-brand-600 hover:underline"
        >
          {{ post.author.username }}
        </a>
        <span class="text-xs text-slate-400">{{ post.createdAt | date:'short' }}</span>
      </div>
      <div class="mt-1 text-sm text-slate-700">
        {{ post.content }}
      </div>

      <img
        *ngIf="post.imageUrl"
        [src]="post.imageUrl"
        alt="Post image"
        class="mt-2 max-h-96 w-full rounded-xl border border-slate-100 object-cover"
      />

      <div class="mt-3 flex items-center justify-between border-t border-slate-50 pt-2">
        <div class="flex items-center gap-4">
          <button
            (click)="toggleLike(post)"
            class="flex items-center gap-1.5 text-sm transition"
            [class.text-red-500]="post.likedByCurrentUser"
            [class.text-slate-400]="!post.likedByCurrentUser"
            [class.hover:text-red-500]="!post.likedByCurrentUser"
          >
            <span>{{ post.likedByCurrentUser ? '♥' : '♡' }}</span>
            <span>{{ post.likeCount || 0 }}</span>
          </button>

          <button
            (click)="toggleComments(post)"
            class="flex items-center gap-1.5 text-sm text-slate-400 transition hover:text-brand-600"
            [class.text-brand-600]="expandedPostId === post.id"
          >
            <span>💬</span>
            <span>{{ post.commentCount || 0 }}</span>
          </button>
        </div>

        <button
          *ngIf="post.author.username === currentUsername"
          (click)="deletePost(post)"
          class="text-xs font-medium text-slate-400 hover:text-red-500"
        >
          Delete
        </button>
      </div>

      <div *ngIf="expandedPostId === post.id" class="mt-3 border-t border-slate-50 pt-3">
        <div *ngIf="commentsLoading[post.id]" class="text-xs text-slate-400">Loading comments...</div>

        <div class="flex flex-col gap-2">
          <div *ngFor="let comment of commentsByPostId[post.id]" class="rounded-lg bg-slate-50 px-3 py-2">
            <div class="flex items-baseline justify-between">
              <a
                [routerLink]="['/users', comment.author.username]"
                class="text-xs font-semibold text-slate-900 hover:text-brand-600 hover:underline"
              >
                {{ comment.author.username }}
              </a>
              <button
                *ngIf="comment.author.username === currentUsername"
                (click)="deleteComment(post, comment)"
                class="text-xs text-slate-400 hover:text-red-500"
              >
                Delete
              </button>
            </div>
            <div class="mt-0.5 text-sm text-slate-700">{{ comment.content }}</div>
          </div>
        </div>

        <form *ngIf="currentUsername" (ngSubmit)="addComment(post)" class="mt-2 flex gap-2">
          <input
            type="text"
            [(ngModel)]="newCommentText[post.id]"
            name="comment-{{ post.id }}"
            placeholder="Add a comment..."
            maxlength="280"
            class="flex-1 rounded-lg border border-slate-300 px-3 py-1.5 text-sm focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-200"
          />
          <button
            type="submit"
            class="rounded-full bg-brand-600 px-4 py-1.5 text-xs font-semibold text-white hover:bg-brand-700"
          >
            Post
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
