server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Angular is a client-side-routed SPA: a direct visit or refresh on a
    # route like /feed has no matching file on disk, so unmatched paths must
    # fall back to index.html and let the Angular router take over. This
    # config is path-prefix-agnostic - Caddy strips any /minitwitter prefix
    # before forwarding here, so nginx always sees paths as if at its own
    # root regardless of the public-facing URL.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
