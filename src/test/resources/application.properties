spring.application.name=MiniTwitter-test

# H2 in-memory DB so tests never need a real Postgres instance
spring.datasource.url=jdbc:h2:mem:minitwitter-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

jwt.secret=test-only-secret-not-used-anywhere-else-32bytes-min
jwt.expiration=86400000

app.upload.dir=${java.io.tmpdir}/minitwitter-test-uploads

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
